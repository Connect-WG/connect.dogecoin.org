name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate links
        run: npm run lint:links

      - name: Type check
        run: npm run types:check

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
